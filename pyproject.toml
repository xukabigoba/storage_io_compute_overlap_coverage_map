[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xukabigoba-storage_io_compute_overlap_coverage_map"
version = "0.1.0"
description = "把候选项映射到类别上，算出NLP 算法工程师·存储 IO 与计算的重叠的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "xukabigoba" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://xukabigoba.github.io"
Repository = "https://github.com/xukabigoba/storage_io_compute_overlap_coverage_map"
Issues = "https://github.com/xukabigoba/storage_io_compute_overlap_coverage_map/issues"

[project.scripts]
storage_io_compute_overlap_coverage_map = "storage_io_compute_overlap_coverage_map:main"

[tool.setuptools]
py-modules = ["storage_io_compute_overlap_coverage_map"]
